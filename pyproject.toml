[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-prime"
version = "0.0.1"
description = "A greeting module with paranoid, defense-in-depth input handling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dr. Prime", email = "your_email@example.com" }]
keywords = ["greeting", "unicode", "security", "input-validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Runtime has no third-party dependencies by design. Everything below is
# a development-only tool.
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "coverage[toml]>=7.4,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "build>=1.2,<2",
    "twine>=5.1,<7",
]

[project.urls]
Homepage = "https://github.com/Always-in-prime/test"
Issues = "https://github.com/Always-in-prime/test/issues"
Source = "https://github.com/Always-in-prime/test"

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["test_prime*"]

[tool.setuptools.package-data]
test_prime = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:setuptools.*",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/test_*.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Fail CI if coverage drops below this. Raise over time; never lower.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# ruff (linter + formatter)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
]
ignore = [
    "E501",   # line length handled by the formatter
    "S101",   # assert is fine in tests
    "T20",    # print() is the CLI's job; scoped below
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "PLR2004"]
"src/test_prime/main.py" = ["T20"]   # the CLI legitimately prints

[tool.ruff.lint.isort]
known-first-party = ["test_prime"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["src", "test_main.py"]

[[tool.mypy.overrides]]
module = "test_main"
# pytest fixtures return Any by design.
disallow_any_expr = false
