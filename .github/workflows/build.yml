name: Build

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Full history so setuptools-scm can derive the version from
          # the tag; shallow clones silently produce "0.0.0" or fail.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=5.1,<7"

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the distributions
        run: python -m twine check dist/*

      - name: Upload build artefacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.5.0
        with:
          name: python-package-distributions
          path: dist/
          # Only the two artefacts we actually produced; refuse anything
          # that appeared in dist/ from a compromised step.
          if-no-files-found: error
          retention-days: 5
