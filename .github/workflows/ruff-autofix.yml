name: Ruff Auto-Fix and PR

on:
  push:
    branches: [main]
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  ruff-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Важно: нужен токен с правами на создание PR
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Check and Fix)
        # --fix применяет автоисправления, format форматирует код
        run: |
          ruff check --fix .
          ruff format .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-fix/ruff-lint # Имя ветки для исправлений
          commit-message: "style: auto-fix ruff issues"
          title: "style: auto-fix ruff issues"
          body: |
            Этот PR был создан автоматически после запуска `ruff` в CI.
            Он содержит только автоматические исправления линтера и форматтера.
          labels: bot, style
          delete-branch: true # Удалять ветку после слияния
